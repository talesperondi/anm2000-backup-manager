name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checar sintaxe
        run: python -m compileall -q anmbackup tools main.py gui.py tests

      - name: Testes unitários
        env:
          ANM2000BM_DATA: ${{ runner.temp }}\anm_ci_data
        run: python -m unittest discover -s tests -v
